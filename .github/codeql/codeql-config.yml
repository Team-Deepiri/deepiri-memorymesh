# Exclude generated/build/runtime artifact paths.
# Test trees are ignored so intentional fixture payloads do not trip
# clear-text / secret heuristics during PR differential analysis.
paths-ignore:
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/coverage/**'
  - '**/logs/**'
  - '**/*.min.js'
  - '**/.venv/**'
  - '**/__pycache__/**'
  - '**/*.pyc'
  - '**/.mypy_cache/**'
  - '**/.pytest_cache/**'
  - 'tests/**'
