[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorymesh"
version = "0.2.0"
description = "Local-first memory layer for AI agents, coding tools, and automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "PyYAML>=6.0",
    "textual>=4.0,<9",
]

[project.optional-dependencies]
embeddings = [
   "sentence-transformers>=3.0.1",
]
security = [
   "cryptography>=42.0.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
memorymesh = "deepiri_memorymesh.cli:app"

[tool.setuptools]
packages = [
    "deepiri_memorymesh",
    "deepiri_memorymesh.providers",
    "deepiri_memorymesh.tui",
    "memorymesh",
]

[tool.setuptools.package-data]
"deepiri_memorymesh.tui" = ["app.tcss"]
